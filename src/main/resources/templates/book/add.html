<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<th:block th:insert="~{layouts/share :: head}"> </th:block>

<body>
    <th:block th:insert="~{layouts/nav :: nav}"> </th:block>
    <div class="container ">
        <h3 class="text-center my-3 ">Add New Roles</h3>

        <form action="/books/add" method="post" enctype="multipart/form-data">

            <div class="mb-3">
                <label for="form-select" class="form-label">Select Category :</label>

                <select class="form-select" name="categoryId" required>
                    <option value="" disabled selected>Categories</option>
                    <option th:each="cate : ${cates}" th:text="${cate.name}" th:value="${cate.id}"></option>


                </select>
            </div>


            <div class="mb-3">
                <label for="title" class="form-label">Title :</label>
                <input type="text" class="form-control rounded-0" id="title" name="title" placeholder="title" required>
            </div>

            <div class="mb-3">
                <label for="author" class="form-label">Author :</label>
                <input type="text" class="form-control rounded-0" id="author" placeholder="author" name="author"
                    required>
            </div>

            <div class="mb-3">
                <label for="publicationDate" class="form-label">Publish Dated :</label>
                <input type="date" class="form-control rounded-0" id="publicationDate" placeholder="publicationDate"
                    required name="publicationDate">
            </div>

            <div class="mb-3">
                <label for="description" class="form-label">Descripiton :</label>
                <textarea rows="3" type="text" class="form-control rounded-0" id="description" required
                    placeholder="publicationDate" name="description"></textarea>
            </div>

            <div class="mb-3">
                <label for="price" class="form-label">Price :</label>
                <input type="number" class="form-control rounded-0" id="price" required placeholder="price"
                    name="price">
            </div>

            <div class="mb-3">
                <label for="stock" class="form-label">Stock :</label>
                <input type="number" class="form-control rounded-0" id="stock" required placeholder="stock"
                    name="stock">
            </div>

            <div class="mb-3">
                <label for="coverImage" class="form-label">Pick Cover Image</label>
                <input class="form-control" type="file" id="coverImage" name="coverImage">
            </div>

            <div class="d-flex justify-content-end">
                <button type="submit" class="btn btn-sm btn-primary">Add</button>
            </div>

        </form>

    </div>

    <th:block th:insert="~{layouts/share :: script}"></th:block>

</body>

</html>
