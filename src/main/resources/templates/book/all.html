<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<th:block th:insert="~{layouts/share :: head}"> </th:block>

<body>
    <th:block th:insert="~{layouts/nav :: nav}"> </th:block>
    <div class="container ">
        <div class="d-flex justify-content-between my-5">
            <h5 class="text-center ">All Roles</h5>
            <a href="/books/add" class="btn btn-success btn-sm juistify-content-conter">
                <i class="fa fa-add"></i>
            </a>
        </div>

        <div class="row ">
            <div th:each="book, status : ${books}">
                <div class="col-md-3 mb-3">
                    <div class="card">
                        <img th:src="@{imgs/{url} (url = ${book.coverImage})}" class="card-img-top" alt="...">
                        <div class="card-body">
                            <h5 class="card-title" th:text="${book.title}">One</h5>
                            <h6 th:text="${book.author}"> Writer - <span class="text-danger">Min Lu</span></h6>
                            <h6 th:text="${book.publicationDate}">Publicaton Date</h6>
                            <p class="card-text" th:text="${book.description}">Some quick example text to build on the
                                card title and make up the bulk
                                of
                                the
                                card’s content.</p>
                            <p class="card-text" th:text="${book.price}">Price - <span
                                    class="text-secondary">20000</span> kyats</p>
                            <p class="card-text" th:text="${book.stock}">Stock - <span>200</span></p>

                            for customers
                            <a href="#" class="btn btn-success btn-sm">
                                Order Now
                                <i class="fa-solid fa-cart-plus"></i>
                            </a>

                            <!-- for Admin -->
                            <a th:href="@{books/edit/{id} (id = ${book.id})}" class="btn btn-warning btn-sm">
                                <i class="fa fa-edit"></i>
                            </a>
                            <a th:href="@{books/drop/{id} (id = ${book.id})}" class="btn btn-danger btn-sm">
                                <i class="fa fa-trash"></i>
                            </a>


                        </div>
                    </div>
                </div>
            </div>


        </div>
    </div>

    <th:block th:insert="~{layouts/share :: script}"></th:block>

</body>

</html>
