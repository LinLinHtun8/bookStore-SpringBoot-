<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<th:block th:insert="~{layouts/share :: head}"> </th:block>

<body>
    <th:block th:insert="~{layouts/nav :: nav}"> </th:block>
    <form th:action="@{/books/edit/{id} (id = ${book.id})}" method="post" enctype="multipart/form-data">

        <div class="mb-3">
            <label for="form-select" class="form-label">Select Category :</label>

            <select class="form-select" name="categoryId" required>
                <option value="" disabled selected>Categories</option>
                <option th:each="cate : ${cates}" th:text="${cate.name}" th:value="${cate.id}"></option>


            </select>
        </div>


        <div class="mb-3">
            <label for="title" class="form-label">Title :</label>
            <input type="text" th:value="${book.title}" class="form-control rounded-0" id="title" name="title" required>
        </div>

        <div class="mb-3">
            <label for="author" class="form-label">Author :</label>
            <input type="text" th:value="${book.author}" class="form-control rounded-0" id="author" name="author"
                required>
        </div>

        <div class="mb-3">
            <label for="publicationDate" class="form-label">Publish Date :</label>
            <input type="date" th:value="${book.publicationDate}" class="form-control rounded-0" id="publicationDate"
                placeholder="publicationDate" required name="publicationDate">
        </div>

        <div class="mb-3">
            <label for="description" class="form-label">Description :</label>
            <textarea rows="3" type="text" th:text="${book.description}" class="form-control rounded-0" id="description"
                required placeholder="publicationDate" name="description"></textarea>
        </div>

        <div class="mb-3">
            <label for="price" class="form-label">Price :</label>
            <input type="number" th:value="${book.price}" class="form-control rounded-0" id="price" required
                placeholder="price" name="price">
        </div>

        <div class="mb-3">
            <label for="stock" class="form-label">Stock :</label>
            <input type="number" th:value="${book.stock}" class="form-control rounded-0" id="stock" required
                placeholder="stock" name="stock">
        </div>

        <div class="mb-3">
            <label class="form-label">Current Cover</label>

            <div>
                <img th:src="@{/images/{image}(image=${book.coverImage})}" alt="Book cover" width="150">
            </div>
        </div>
        <br><br>

        <div class="mb-3">
            <label for="coverImage" class="form-label">
                Change Cover
            </label>

            <input class="form-control" type="file" id="coverImage" name="coverImage">
        </div>

        <div class="d-flex justify-content-end">
            <button type="submit" class="btn btn-sm btn-primary">Update</button>
        </div>

    </form>

    <th:block th:insert="~{layouts/share :: script}"></th:block>

</body>

</html>
