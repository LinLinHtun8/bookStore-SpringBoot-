<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<th:block th:insert="~{layouts/share :: head}"> </th:block>

<body>
    <th:block th:insert="~{layouts/nav :: nav}"> </th:block>
    <div class="container ">
        <div class="container ">
            <div class="d-flex justify-content-between my-5">
                <h5 class="text-center ">All Roles</h5>
                <a href="/roles/add" class="btn btn-primary btn-sm">
                    <i class="fa fa-add"></i>
                </a>
            </div>
            <table class="table table-bordered">
                <thead>
                    <tr>
                        <th scope="col">No</th>
                        <th scope="col">Id</th>
                        <th scope="col">Name</th>
                        <th scope="col">Action</th>
                    </tr>
                </thead>
                <th:block th:each="role, status : ${roles}">
                    <tbody>
                        <tr>
                            <td th:text="${status.count}">No</td>
                            <td th:text="${role.id}">roleid</td>
                            <td th:text="${role.name}">rolename</td>
                            <td>
                                <a th:href="@{roles/edit/{id}   (id = ${role.id})}" class="btn btn-sm btn-warning"><i class="fa fa-edit"></i></a>
                                <a th:href="@{roles/delete/{id} (id = ${role.id})}" class="btn btn-sm btn-danger"><i class="fa fa-trash"></i></a>
                                <a href="#" class="btn btn-sm btn-success"><i class="fa fa-trash"></i></a>
                            </td>

                    </tbody>
                </th:block>

            </table>


        </div>
    </div>

    <th:block th:insert="~{layouts/share :: script}"></th:block>

</body>

</html>
