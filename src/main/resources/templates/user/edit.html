<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<th:block th:insert="~{layouts/share :: head}"> </th:block>

<body>
    <th:block th:insert="~{layouts/nav :: nav}"> </th:block>
    <div class="container ">
        <div class="row">
            <div class="col-md-12">
                <a th:href="@{/users}" class="btn btn-sm btn-primary my-3"><i class="fa fa-arrow-left"></i> Back</a>
            </div>
        <h1 class="text-center my-5">User Role Edit</h1>

        <div class="row">
            <div class="col-md-6">

                <h3>Current Roles</h3>


                <table class="table table-bordered">
                    <thead>
                        <tr>
                            <th scope="col">Id</th>
                            <th scope="col">Name</th>
                            <th scope="col">Action</th>
                        </tr>
                    </thead>
                    <th:block th:each="role : ${user.roles}">
                        <tbody>
                            <tr>
                                <td th:text="${user.id}">0</td>
                                <td th:text="${role.name}"> 
                                </td>
                                <td>
                                    <a  class="btn btn-sm btn-danger" th:href="@{/users/removeRole/{userId}/{roleId}(userId=${user.id}, roleId=${role.id})}"><i class="fa fa-remove"></i></a>

                                </td>
                            </tr>
                        </tbody>
                    </th:block>
                </table>

            </div>

            <div class="col-md-6">
                <h3>Avaliable Roles</h4>
                    <table class="table table-bordered">
                        <thead>
                            <tr>
                                <th scope="col">No</th>
                                <th scope="col">Name</th>
                                <th scope="col">Action</th>
                            </tr>
                        </thead>

                        <th:block th:each="role, status : ${roles}">
                            <tbody>
                                <tr>
                                    <td th:text="${status.count}">1</td>
                                    <td th:text="${role.name}">Role_Admin</td>
                                    <td>
                                        <a th:href="@{/users/addRole/{userId}/{roleId} (userId = ${user.id}, roleId = ${role.id})}" class="btn btn-sm btn-warning"><i class="fa fa-add"></i></a>

                                    </td>
                                </tr>
                            </tbody>

                        </th:block>

                    </table>
            </div>
        </div>




    </div>

    <th:block th:insert="~{layouts/share :: script}"></th:block>

</body>

</html>
