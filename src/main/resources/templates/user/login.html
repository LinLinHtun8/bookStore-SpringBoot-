<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<th:block th:insert="~{layouts/share :: head}"> </th:block>

<body>
     <div class="container ">
        <h3 class="text-center my-5 ">User Login</h3>

        <form action="/users/login" method="post">



            <div class="mb-3">
                <label for="username" class="form-label">Title :</label>
                <input type="text" class="form-control rounded-0" id="username" placeholder="Enter Your Name"
                    name="username">
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Password :</label>
                <input type="password" class="form-control rounded-0" id="password" placeholder="*********"
                    name="password">
            </div>


            <div class="d-flex justify-content-between">
                <a href="/users/register">Register Now</a>
                <button type="submit" class="btn btn-sm btn-primary">login</button>
            </div>

        </form>
    </div>
<th:block th:insert="~{layouts/share :: script}"></th:block>
    
</body>

</html>
