<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<th:block th:insert="~{layouts/share :: head}"> </th:block>

<body>
     <div class="container ">
        <h3 class="text-center my-5 ">User Register</h3>

        <form action="/users/register" method="post">



            <div class="mb-3">
                <label for="name" class="form-label">Title :</label>
                <input required type="text" class="form-control rounded-0" id="name" placeholder="Enter Your Name"
                    name="name">
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">Email :</label>
                <input required type="email" class="form-control rounded-0" id="email" placeholder="Enter Your email"
                    name="email">
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Password :</label>
                <input required type="password" class="form-control rounded-0" id="password" placeholder="*********"
                    name="password">
            </div>


            <div class="d-flex justify-content-between">
                <a href="/users/login">Login </a>
                <button type="submit" class="btn btn-sm btn-primary">Register</button>
            </div>

        </form>

    </div>

<th:block th:insert="~{layouts/share :: script}"></th:block>
    
</body>

</html>
