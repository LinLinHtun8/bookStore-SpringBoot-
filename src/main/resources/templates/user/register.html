<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<th:block th:insert="~{layouts/share :: head}"> </th:block>

<body>
    <div class="container ">
        <h3 class="text-center my-5 ">User Register</h3>

        <form action="/users/register" th:object="${user}" method="post">



            <div class="mb-3">
                <label for="name" class="form-label">Title :</label>
                <input type="text" class="form-control rounded-0" id="name" placeholder="Enter Your Name" name="name" th:field="*{name}">
                <span th:if("${field.hasErrors('name')}") th:errors="*{name}" class="error">Error</span>

            </div>

            <div class="mb-3">
                <label for="email" class="form-label">Email :</label>
                <input  type="email" class="form-control rounded-0" id="email" placeholder="Enter Your email"
                    name="email" th:field="*{email}">
                <span th:if("${field.hasErrors('email')}") th:errors="*{email}" class="error"></span>

            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Password :</label>
                <input  type="password" class="form-control rounded-0" id="password" placeholder="*********"
                    name="password" th:field="*{password}">
                <span th:if("${field.hasErrors('password')}") th:errors="*{password}" class="error"></span>
            </div>


            <div class="d-flex justify-content-between">
                <a href="/users/login">Login </a>
                <button type="submit" class="btn btn-sm btn-primary">Register</button>
            </div>

        </form>

    </div>

    <th:block th:insert="~{layouts/share :: script}"></th:block>

</body>

</html>
